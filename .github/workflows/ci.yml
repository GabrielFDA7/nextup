# Integração Contínua do NextUp.
#
# Roda sozinho a cada push e a cada pull request. Se algo quebrar, o GitHub marca
# o commit com um X vermelho antes que o problema chegue na branch principal.
#
# É o que produz o selo verde no topo do README — e é a primeira coisa que um
# avaliador técnico olha ao abrir o repositório.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest

    strategy:
      # Não para tudo quando uma versão falha: queremos saber se o problema é
      # de uma versão só do Python ou de todas.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        # Os testes de interface ficam no job abaixo: exigem baixar um navegador,
        # e não faz sentido repetir isso em três versões do Python.
        run: pytest -m "not e2e"

  # ---------------------------------------------------------------------------
  # Interface, em navegador de verdade.
  #
  # Separado porque tem outro custo e outra natureza: baixa o Chromium e valida
  # o que nenhum teste de API alcança — que o Leaflet carrega, que negar o GPS
  # não quebra o app, que a tela não rola de lado no celular.
  # ---------------------------------------------------------------------------
  interface-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"

      - name: Instalar o navegador
        # `--with-deps` traz as bibliotecas de sistema que o Chromium precisa no
        # Ubuntu; sem elas ele instala mas não abre.
        run: playwright install --with-deps chromium

      - name: Testes de interface
        run: pytest -m e2e

  # ---------------------------------------------------------------------------
  # A imagem Docker.
  #
  # Este job é o que garante que o Dockerfile funciona. Um Dockerfile que nunca
  # foi construído é um arquivo de texto com boas intenções: ele só vira uma
  # promessa verificável quando alguém o constrói e sobe o contêiner.
  # ---------------------------------------------------------------------------
  imagem-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Construir a imagem
        run: docker build -t nextup:ci .

      - name: Subir o contêiner
        # O coletor vai desligado de propósito. Ligado, cada build do CI passaria a
        # consultar a ThemeParks.wiki de verdade — uma API pública, gratuita e
        # mantida por voluntários. Verificar a imagem não justifica gerar tráfego
        # lá, e o coletor já é testado à exaustão na suíte, com respx.
        run: |
          docker run -d --name nextup-ci -p 8000:8000 \
            -e NEXTUP_COLLECTOR_ENABLED=false \
            nextup:ci

      - name: Esperar ficar saudável
        # Usa o HEALTHCHECK da própria imagem: se ele nunca virar "healthy", o
        # problema é do contêiner, não do teste.
        run: |
          for tentativa in $(seq 1 30); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' nextup-ci)
            echo "tentativa $tentativa: $estado"
            [ "$estado" = "healthy" ] && exit 0
            [ "$estado" = "unhealthy" ] && break
            sleep 2
          done
          echo "::error::o contêiner não ficou saudável"
          docker logs nextup-ci
          exit 1

      - name: A API responde
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: A interface é servida
        run: |
          curl --fail --silent --show-error http://localhost:8000/ | grep -q "NextUp"

      - name: Não roda como root
        # Processo como root dentro do contêiner é um risco desnecessário; este
        # passo impede que alguém remova o `USER` sem perceber.
        run: |
          usuario=$(docker exec nextup-ci whoami)
          echo "usuário do contêiner: $usuario"
          [ "$usuario" = "nextup" ]

      - name: As migrações foram aplicadas no start
        # Desde a Fase 6 o contêiner roda `alembic upgrade head` antes do uvicorn.
        # Sem este passo, alguém poderia remover `migrations/` da imagem — ou o
        # `alembic upgrade` do CMD — e nada quebraria: o servidor subiria igual, e
        # o problema só apareceria no primeiro deploy que mudasse o esquema.
        run: |
          versao=$(docker exec nextup-ci alembic current 2>&1 | tail -n 1)
          echo "versão do banco no contêiner: $versao"
          echo "$versao" | grep -q "(head)"

      - name: A tabela de histórico existe
        # Confirma o efeito da migração, não só o relato dela.
        run: |
          docker exec nextup-ci python -c "
          import sqlite3
          tabelas = sqlite3.connect('/app/nextup.db').execute(
              \"SELECT name FROM sqlite_master WHERE type='table'\"
          ).fetchall()
          nomes = {t[0] for t in tabelas}
          print('tabelas:', sorted(nomes))
          assert 'queue_snapshots' in nomes, 'a migração não criou a tabela'
          "

      - name: Respeita a variável PORT
        # Plataformas de hospedagem escolhem a porta e a informam por variável de
        # ambiente — o Render usa 10000. Se a imagem ignorasse isso, o serviço
        # subiria saudável e nunca receberia uma requisição.
        run: |
          docker run -d --name nextup-porta -e PORT=10000 -p 9000:10000 \
            -e NEXTUP_COLLECTOR_ENABLED=false nextup:ci
          for tentativa in $(seq 1 20); do
            if curl --fail --silent http://localhost:9000/api/health > /dev/null; then
              echo "respondeu na porta informada por PORT"
              docker rm -f nextup-porta
              exit 0
            fi
            sleep 2
          done
          echo "::error::a imagem ignorou a variável PORT"
          docker logs nextup-porta
          docker rm -f nextup-porta
          exit 1

      - name: Logs do contêiner
        # Roda mesmo se algo acima falhar — sem os logs, um erro no CI vira
        # adivinhação.
        if: always()
        run: docker logs nextup-ci

      - name: Derrubar o contêiner
        if: always()
        run: docker rm -f nextup-ci
