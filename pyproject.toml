[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextup"
version = "0.1.0"
description = "Recomendador em tempo real da próxima atração a visitar em parques temáticos, combinando tempo de fila e distância a percorrer."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel de Angelis", email = "gabrielfariaangelis@gmail.com" }]
keywords = ["theme-parks", "disney", "wait-times", "fastapi", "recommendation"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Persistência do histórico de filas (Fase 6). O SQLAlchemy é o que permite
    # desenvolver em SQLite e publicar em Postgres sem reescrever consulta.
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    # Drivers assíncronos: um por banco. O projeto inteiro é async, e um driver
    # síncrono travaria o event loop do FastAPI a cada gravação.
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    # Le o `.env` no desenvolvimento. Ja vinha de carona com `uvicorn[standard]`,
    # mas depender de dependencia transitiva e apostar que outro pacote nao vai
    # deixar de usa-la numa versao futura.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

# Testes de ponta a ponta da interface, num navegador de verdade. Separados do
# grupo `dev` porque exigem baixar o Chromium (`playwright install chromium`),
# e nem toda máquina que só quer rodar o lint precisa disso.
e2e = [
    "pytest-playwright>=0.5",
]

[project.scripts]
nextup = "nextup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextup"]

# ---------------------------------------------------------------------------
# Ruff — lint e formatação
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle — erros de estilo
    "W",    # pycodestyle — avisos
    "F",    # pyflakes — variáveis não usadas, imports mortos
    "I",    # isort — ordenação de imports
    "N",    # pep8-naming — convenções de nome
    "UP",   # pyupgrade — sintaxe moderna
    "B",    # flake8-bugbear — armadilhas comuns
    "SIM",  # flake8-simplify — simplificações
    "RUF",  # regras do próprio ruff
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
markers = [
    "e2e: teste de interface em navegador real; exige o extra `e2e` e `playwright install chromium`",
]
